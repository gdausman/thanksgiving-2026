<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Give Thanks and Eat · Thanksgiving 2026</title>
  <meta name="description" content="Thanksgiving 2026 Feast hosted by the Dausman House of Redberry Court" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parchment: "#f6ecd9",
            cinnamon: "#8b4513",
            rust: "#b4532a",
            amberglow: "#d4a017",
            sage: "#6b7f5a",
            harvest: "#3d2a1a",
          },
          fontFamily: {
            display: ['"Playfair Display"', "Georgia", "serif"],
            sans: ['"Plus Jakarta Sans"', "system-ui", "sans-serif"],
          },
          boxShadow: {
            card: "0 10px 30px -12px rgba(61, 42, 26, 0.28)",
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html { scroll-behavior: smooth; }
    body {
      background-color: #f6ecd9;
      background-image:
        radial-gradient(1200px 500px at 10% -10%, rgba(212, 160, 23, 0.18), transparent 55%),
        radial-gradient(900px 420px at 110% 8%, rgba(180, 83, 42, 0.14), transparent 50%),
        radial-gradient(700px 380px at 50% 110%, rgba(107, 127, 90, 0.16), transparent 45%);
    }
    .pills {
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .pills::-webkit-scrollbar { display: none; }
    .equal-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    @media (min-width: 768px) {
      .equal-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: 1fr;
      }
    }
    @media (min-width: 1100px) {
      .equal-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body class="min-h-screen font-sans text-harvest antialiased">
  <div class="mx-auto max-w-6xl px-4 pb-16 pt-8 sm:px-6">
    <header class="relative overflow-hidden rounded-3xl border border-amberglow/25 bg-gradient-to-br from-[#fff8ea] via-[#f4e0c4] to-[#e8c9a0] px-5 py-8 shadow-card sm:px-10 sm:py-10">
      <div class="pointer-events-none absolute -right-10 -top-10 h-40 w-40 rounded-full bg-rust/10"></div>
      <div class="pointer-events-none absolute bottom-0 left-8 h-24 w-24 rounded-full bg-sage/15"></div>
      <p class="text-xs font-semibold uppercase tracking-[0.28em] text-rust">Thanksgiving 2026 Feast</p>
      <h1 class="mt-3 font-display text-4xl leading-tight text-cinnamon sm:text-5xl">Give Thanks and Eat</h1>
      <p class="mt-3 max-w-xl text-base font-medium text-harvest/80 sm:text-lg">Hosted by the Dausman House of Redberry Court</p>
      <div class="mt-6 flex flex-wrap items-center gap-3">
        <div id="assigned-counter" class="inline-flex items-center gap-2 rounded-full bg-cinnamon px-4 py-2 text-sm font-semibold text-parchment shadow-sm">
          <span class="h-2 w-2 rounded-full bg-amberglow"></span>
          <span>0 of 22 Assigned</span>
        </div>
        <a
          id="sheets-link"
          href="https://docs.google.com/spreadsheets/d/1Vr24wohBgNanuCESS1fM1S10b0pZbtxivoeqqw9ebUY"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1 rounded-full border border-cinnamon/20 bg-white/70 px-4 py-2 text-sm font-semibold text-cinnamon backdrop-blur transition hover:bg-white"
        >
          Edit in Google Sheets ↗
        </a>
      </div>
    </header>

    <section class="mt-8">
      <div class="mb-4 flex items-end justify-between gap-3">
        <h2 class="font-display text-2xl text-cinnamon">Households</h2>
        <p class="text-sm text-harvest/60">Who is bringing what</p>
      </div>
      <div id="household-grid" class="equal-grid"></div>
    </section>

    <section class="mt-10">
      <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <h2 class="font-display text-2xl text-cinnamon">Dish board</h2>
          <p class="text-sm text-harvest/60">Tap a category to filter the feast</p>
        </div>
        <p id="sync-status" class="text-xs font-medium uppercase tracking-wider text-sage">Loading the menu…</p>
      </div>
      <div id="category-pills" class="pills mb-5 flex gap-2 overflow-x-auto pb-1"></div>
      <div id="dish-list" class="space-y-3"></div>
    </section>
  </div>

  <script>
    const SHEET_ID = "1Vr24wohBgNanuCESS1fM1S10b0pZbtxivoeqqw9ebUY";
    const SHEET_URL =
      "https://docs.google.com/spreadsheets/d/" +
      SHEET_ID +
      "/gviz/tq?tqx=responseHandler:handleSheetResponse&sheet=Dishes";
    const TOTAL_DISHES = 22;
    const HOUSEHOLDS = [
      { name: "Greg & Danielle", accent: "from-[#8b4513] to-[#b4532a]" },
      { name: "Ron & Denise", accent: "from-[#6b7f5a] to-[#8a9a74]" },
      { name: "Eric & Cathy", accent: "from-[#b4532a] to-[#d4a017]" },
      { name: "Joey, Kim, & Emerie", accent: "from-[#d4a017] to-[#c47a2c]" },
    ];
    const CATEGORIES = ["All", "Appetizers", "Main dish", "Side Dish", "Dessert", "Drinks"];

    let dishes = [];
    let activeCategory = "All";

    function cell(row, index) {
      const col = row.c && row.c[index];
      if (!col || col.v == null || col.v === "") return "";
      return String(col.f != null ? col.f : col.v).trim();
    }

    function isGlutenFree(value) {
      return /gluten-?free/i.test(value) && !/contains gluten/i.test(value);
    }

    function isAssigned(dish) {
      return Boolean(dish.assignedTo) || /assigned/i.test(dish.status);
    }

    window.handleSheetResponse = function handleSheetResponse(payload) {
      const rows = (payload && payload.table && payload.table.rows) || [];
      dishes = rows
        .map(function (row) {
          return {
            dish: cell(row, 1),
            category: cell(row, 2),
            assignedTo: cell(row, 3),
            status: cell(row, 4),
            oven: cell(row, 5),
            glutenFree: cell(row, 6),
            notes: cell(row, 7),
          };
        })
        .filter(function (item) {
          return item.dish;
        });
      document.getElementById("sync-status").textContent = "Live from Google Sheets";
      render();
    };

    function householdDishes(name) {
      return dishes.filter(function (dish) {
        return dish.assignedTo === name;
      });
    }

    function renderCounter() {
      const assigned = dishes.filter(isAssigned).length;
      const total = dishes.length || TOTAL_DISHES;
      document.querySelector("#assigned-counter span:last-child").textContent =
        assigned + " of " + total + " Assigned";
    }

    function renderHouseholds() {
      const grid = document.getElementById("household-grid");
      grid.innerHTML = HOUSEHOLDS.map(function (house) {
        const assigned = householdDishes(house.name);
        const list = assigned.length
          ? assigned
              .map(function (dish) {
                return (
                  '<li class="flex items-start justify-between gap-2 py-1.5">' +
                  '<span class="font-medium">' +
                  escapeHtml(dish.dish) +
                  "</span>" +
                  (isGlutenFree(dish.glutenFree)
                    ? '<span class="shrink-0 rounded bg-sage px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wide text-white">GF</span>'
                    : "") +
                  "</li>"
                );
              })
              .join("")
          : '<li class="py-6 text-center text-sm italic text-harvest/45">To be assigned</li>';
        return (
          '<article class="flex h-full min-h-[220px] flex-col overflow-hidden rounded-2xl border border-cinnamon/10 bg-white/80 shadow-card backdrop-blur">' +
          '<div class="bg-gradient-to-r ' +
          house.accent +
          ' px-4 py-3">' +
          '<h3 class="font-display text-lg text-white">' +
          escapeHtml(house.name) +
          "</h3>" +
          '<p class="text-xs font-medium text-white/80">' +
          assigned.length +
          (assigned.length === 1 ? " dish" : " dishes") +
          "</p>" +
          "</div>" +
          '<ul class="flex-1 px-4 py-3 text-sm">' +
          list +
          "</ul>" +
          "</article>"
        );
      }).join("");
    }

    function renderPills() {
      const wrap = document.getElementById("category-pills");
      wrap.innerHTML = CATEGORIES.map(function (cat) {
        const on = cat === activeCategory;
        return (
          '<button type="button" data-category="' +
          escapeHtml(cat) +
          '" class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-semibold transition ' +
          (on
            ? "bg-cinnamon text-parchment shadow-sm"
            : "border border-cinnamon/15 bg-white/70 text-cinnamon hover:bg-white") +
          '">' +
          escapeHtml(cat) +
          "</button>"
        );
      }).join("");
      wrap.querySelectorAll("button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          activeCategory = btn.getAttribute("data-category");
          render();
        });
      });
    }

    function statusBadge(dish) {
      if (isAssigned(dish)) {
        return (
          '<span class="rounded-full bg-sage/15 px-2.5 py-1 text-xs font-semibold text-sage">' +
          escapeHtml(dish.assignedTo || dish.status || "Assigned") +
          "</span>"
        );
      }
      return '<span class="rounded-full bg-rust/10 px-2.5 py-1 text-xs font-semibold text-rust">Unassigned</span>';
    }

    function renderDishes() {
      const list = document.getElementById("dish-list");
      const visible = dishes.filter(function (dish) {
        return activeCategory === "All" || dish.category === activeCategory;
      });
      if (!visible.length) {
        list.innerHTML =
          '<p class="rounded-2xl border border-dashed border-cinnamon/20 bg-white/50 px-4 py-10 text-center text-sm text-harvest/60">No dishes in this category yet.</p>';
        return;
      }
      list.innerHTML = visible
        .map(function (dish) {
          const gf = isGlutenFree(dish.glutenFree)
            ? '<span class="rounded bg-sage px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wide text-white">GF</span>'
            : "";
          const oven = dish.oven
            ? '<span class="text-xs text-harvest/65">Oven: ' + escapeHtml(dish.oven) + "</span>"
            : "";
          const notes = dish.notes
            ? '<p class="mt-1 text-xs text-harvest/55">' + escapeHtml(dish.notes) + "</p>"
            : "";
          return (
            '<article class="rounded-2xl border border-cinnamon/10 bg-white/80 px-4 py-3 shadow-sm">' +
            '<div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">' +
            '<div class="min-w-0">' +
            '<div class="flex flex-wrap items-center gap-2">' +
            '<h3 class="font-display text-lg text-cinnamon">' +
            escapeHtml(dish.dish) +
            "</h3>" +
            gf +
            "</div>" +
            '<div class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1">' +
            '<span class="text-xs font-semibold uppercase tracking-wider text-amberglow">' +
            escapeHtml(dish.category) +
            "</span>" +
            oven +
            "</div>" +
            notes +
            "</div>" +
            '<div class="shrink-0">' +
            statusBadge(dish) +
            "</div>" +
            "</div>" +
            "</article>"
          );
        })
        .join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function render() {
      renderCounter();
      renderHouseholds();
      renderPills();
      renderDishes();
    }

    function loadSheet() {
      const script = document.createElement("script");
      script.src = SHEET_URL;
      script.onerror = function () {
        document.getElementById("sync-status").textContent = "Could not load the sheet";
      };
      document.body.appendChild(script);
    }

    render();
    loadSheet();
  </script>
</body>
</html>
