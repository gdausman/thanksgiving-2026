<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Give Thanks and Eat · Thanksgiving 2026</title>
  <meta name="description" content="Thanksgiving 2026 Feast hosted by the Dausman House of Redberry Court" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parchment: "#f6ecd9",
            cinnamon: "#8b4513",
            rust: "#b4532a",
            amberglow: "#d4a017",
            sage: "#6b7f5a",
            harvest: "#3d2a1a",
          },
          fontFamily: {
            display: ['"Playfair Display"', "Georgia", "serif"],
            sans: ['"Plus Jakarta Sans"', "system-ui", "sans-serif"],
          },
          boxShadow: {
            card: "0 10px 30px -12px rgba(61, 42, 26, 0.28)",
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html { scroll-behavior: smooth; }
    body {
      background-color: #f6ecd9;
      background-image:
        radial-gradient(1200px 500px at 10% -10%, rgba(212, 160, 23, 0.18), transparent 55%),
        radial-gradient(900px 420px at 110% 8%, rgba(180, 83, 42, 0.14), transparent 50%),
        radial-gradient(700px 380px at 50% 110%, rgba(107, 127, 90, 0.16), transparent 45%);
    }
    .pills {
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .pills::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen font-sans text-harvest antialiased">
  <div class="mx-auto max-w-6xl px-4 pb-16 pt-8 sm:px-6">
    <header class="relative overflow-hidden rounded-3xl border border-amberglow/25 bg-gradient-to-br from-[#fff8ea] via-[#f4e0c4] to-[#e8c9a0] px-5 py-8 shadow-card sm:px-10 sm:py-10">
      <div class="pointer-events-none absolute -right-10 -top-10 h-40 w-40 rounded-full bg-rust/10"></div>
      <div class="pointer-events-none absolute bottom-0 left-8 h-24 w-24 rounded-full bg-sage/15"></div>
      <p class="text-xs font-semibold uppercase tracking-[0.28em] text-rust">Thanksgiving 2026 Feast</p>
      <h1 class="mt-3 font-display text-4xl leading-tight text-cinnamon sm:text-5xl">Give Thanks and Eat</h1>
      <p class="mt-3 max-w-xl text-base font-medium text-harvest/80 sm:text-lg">Hosted by the Dausman House of Redberry Court</p>

      <div class="mt-6 grid grid-cols-2 gap-3 sm:max-w-md">
        <div class="rounded-2xl bg-sage px-4 py-3 text-white shadow-sm">
          <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-white/80">Assigned</p>
          <p id="assigned-count" class="font-display text-3xl leading-none">0</p>
          <p id="assigned-of" class="mt-1 text-xs text-white/80">of 22 dishes</p>
        </div>
        <div class="rounded-2xl bg-rust px-4 py-3 text-white shadow-sm">
          <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-white/80">Unassigned</p>
          <p id="unassigned-count" class="font-display text-3xl leading-none">0</p>
          <p id="unassigned-of" class="mt-1 text-xs text-white/80">still open</p>
        </div>
      </div>

      <div id="household-summary" class="mt-4 flex flex-wrap gap-2"></div>

      <div class="mt-5">
        <a
          id="sheets-link"
          href="https://docs.google.com/spreadsheets/d/1Vr24wohBgNanuCESS1fM1S10b0pZbtxivoeqqw9ebUY"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1 rounded-full border border-cinnamon/20 bg-white/70 px-4 py-2 text-sm font-semibold text-cinnamon backdrop-blur transition hover:bg-white"
        >
          Edit in Google Sheets ↗
        </a>
      </div>
    </header>

    <section class="mt-10">
      <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <h2 class="font-display text-2xl text-cinnamon">Dish board</h2>
          <p class="text-sm text-harvest/60">Filter by household, then by dish type</p>
        </div>
        <p id="sync-status" class="text-xs font-medium uppercase tracking-wider text-sage">Loading the menu…</p>
      </div>

      <p class="mb-2 text-xs font-semibold uppercase tracking-[0.18em] text-harvest/55">Household</p>
      <div id="household-pills" class="pills mb-5 flex gap-2 overflow-x-auto pb-1"></div>

      <p class="mb-2 text-xs font-semibold uppercase tracking-[0.18em] text-harvest/55">Category</p>
      <div id="category-pills" class="pills mb-5 flex gap-2 overflow-x-auto pb-1"></div>

      <div id="dish-list" class="space-y-3"></div>
    </section>
  </div>

  <script>
    const SHEET_ID = "1Vr24wohBgNanuCESS1fM1S10b0pZbtxivoeqqw9ebUY";
    const SHEET_URL =
      "https://docs.google.com/spreadsheets/d/" +
      SHEET_ID +
      "/gviz/tq?tqx=responseHandler:handleSheetResponse&sheet=Dishes";
    const TOTAL_DISHES = 22;
    const HOUSEHOLDS = [
      { name: "Greg & Danielle", color: "#8b4513", soft: "rgba(139, 69, 19, 0.12)" },
      { name: "Ron & Denise", color: "#6b7f5a", soft: "rgba(107, 127, 90, 0.14)" },
      { name: "Eric & Cathy", color: "#b4532a", soft: "rgba(180, 83, 42, 0.14)" },
      { name: "Joey, Kim, & Emerie", color: "#d4a017", soft: "rgba(212, 160, 23, 0.18)" },
    ];
    const UNASSIGNED = { name: "Unassigned", color: "#7a6a58", soft: "rgba(122, 106, 88, 0.12)" };
    const CATEGORIES = ["All", "Appetizers", "Main dish", "Side Dish", "Dessert", "Drinks"];

    let dishes = [];
    let activeHousehold = "All";
    let activeCategory = "All";

    function cell(row, index) {
      const col = row.c && row.c[index];
      if (!col || col.v == null || col.v === "") return "";
      return String(col.f != null ? col.f : col.v).trim();
    }

    function isGlutenFree(value) {
      return /gluten-?free/i.test(value) && !/contains gluten/i.test(value);
    }

    function isAssigned(dish) {
      const who = (dish.assignedTo || "").trim();
      return Boolean(who) && !/^unassigned$/i.test(who);
    }

    function householdFor(dish) {
      if (!isAssigned(dish)) return UNASSIGNED;
      return HOUSEHOLDS.find(function (house) {
        return house.name === dish.assignedTo;
      }) || { name: dish.assignedTo, color: "#8b4513", soft: "rgba(139, 69, 19, 0.12)" };
    }

    window.handleSheetResponse = function handleSheetResponse(payload) {
      const rows = (payload && payload.table && payload.table.rows) || [];
      dishes = rows
        .map(function (row) {
          return {
            dish: cell(row, 1),
            category: cell(row, 2),
            assignedTo: cell(row, 3),
            status: cell(row, 4),
            oven: cell(row, 5),
            glutenFree: cell(row, 6),
            notes: cell(row, 7),
          };
        })
        .filter(function (item) {
          return item.dish;
        });
      document.getElementById("sync-status").textContent = "Live from Google Sheets";
      render();
    };

    function matchesHousehold(dish) {
      if (activeHousehold === "All") return true;
      if (activeHousehold === "Unassigned") return !isAssigned(dish);
      return dish.assignedTo === activeHousehold;
    }

    function renderHeader() {
      const assigned = dishes.filter(isAssigned);
      const total = dishes.length || TOTAL_DISHES;
      const unassigned = total - assigned.length;
      document.getElementById("assigned-count").textContent = String(assigned.length);
      document.getElementById("unassigned-count").textContent = String(unassigned);
      document.getElementById("assigned-of").textContent = "of " + total + " dishes";
      document.getElementById("unassigned-of").textContent = unassigned === 1 ? "still open" : "still open";

      const summary = document.getElementById("household-summary");
      const chips = HOUSEHOLDS.map(function (house) {
        const count = dishes.filter(function (dish) {
          return dish.assignedTo === house.name;
        }).length;
        return (
          '<button type="button" data-household="' +
          escapeHtml(house.name) +
          '" class="inline-flex items-center gap-2 rounded-full bg-white/70 px-3 py-1.5 text-xs font-semibold shadow-sm backdrop-blur">' +
          '<span class="h-2.5 w-2.5 rounded-full" style="background:' +
          house.color +
          '"></span>' +
          '<span style="color:' +
          house.color +
          '">' +
          escapeHtml(house.name) +
          "</span>" +
          '<span class="text-harvest/60">' +
          count +
          "</span>" +
          "</button>"
        );
      }).join("");
      summary.innerHTML = chips;
      summary.querySelectorAll("button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          activeHousehold = btn.getAttribute("data-household");
          render();
        });
      });
    }

    function pillButton(label, on, color) {
      if (on) {
        return (
          '<button type="button" class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-semibold text-white shadow-sm" style="background:' +
          color +
          '">' +
          escapeHtml(label) +
          "</button>"
        );
      }
      return (
        '<button type="button" class="whitespace-nowrap rounded-full border bg-white/70 px-4 py-2 text-sm font-semibold transition hover:bg-white" style="border-color:' +
        color +
        "33;color:" +
        color +
        '">' +
        escapeHtml(label) +
        "</button>"
      );
    }

    function renderHouseholdPills() {
      const wrap = document.getElementById("household-pills");
      const options = [{ name: "All", color: "#8b4513" }].concat(HOUSEHOLDS).concat([UNASSIGNED]);
      wrap.innerHTML = options
        .map(function (house) {
          const btn = pillButton(house.name, house.name === activeHousehold, house.color);
          return btn.replace("<button", '<button data-household="' + escapeHtml(house.name) + '"');
        })
        .join("");
      wrap.querySelectorAll("button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          activeHousehold = btn.getAttribute("data-household");
          render();
        });
      });
    }

    function renderCategoryPills() {
      const wrap = document.getElementById("category-pills");
      wrap.innerHTML = CATEGORIES.map(function (cat) {
        const btn = pillButton(cat, cat === activeCategory, "#8b4513");
        return btn.replace("<button", '<button data-category="' + escapeHtml(cat) + '"');
      }).join("");
      wrap.querySelectorAll("button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          activeCategory = btn.getAttribute("data-category");
          render();
        });
      });
    }

    function renderDishes() {
      const list = document.getElementById("dish-list");
      const visible = dishes.filter(function (dish) {
        const catOk = activeCategory === "All" || dish.category === activeCategory;
        return catOk && matchesHousehold(dish);
      });
      if (!visible.length) {
        list.innerHTML =
          '<p class="rounded-2xl border border-dashed border-cinnamon/20 bg-white/50 px-4 py-10 text-center text-sm text-harvest/60">No dishes match these filters.</p>';
        return;
      }
      list.innerHTML = visible
        .map(function (dish) {
          const house = householdFor(dish);
          const gf = isGlutenFree(dish.glutenFree)
            ? '<span class="rounded px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wide text-white" style="background:#6b7f5a">GF</span>'
            : "";
          const oven = dish.oven
            ? '<span class="text-xs text-harvest/65">Oven: ' + escapeHtml(dish.oven) + "</span>"
            : "";
          const notes = dish.notes
            ? '<p class="mt-1 text-xs text-harvest/55">' + escapeHtml(dish.notes) + "</p>"
            : "";
          return (
            '<article class="rounded-2xl border bg-white/80 px-4 py-3 shadow-sm" style="border-color:' +
            house.color +
            "33;border-left:6px solid " +
            house.color +
            ";background:" +
            house.soft +
            '">' +
            '<div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">' +
            '<div class="min-w-0">' +
            '<div class="flex flex-wrap items-center gap-2">' +
            '<h3 class="font-display text-lg text-cinnamon">' +
            escapeHtml(dish.dish) +
            "</h3>" +
            gf +
            "</div>" +
            '<div class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1">' +
            '<span class="text-xs font-semibold uppercase tracking-wider text-amberglow">' +
            escapeHtml(dish.category) +
            "</span>" +
            oven +
            "</div>" +
            notes +
            "</div>" +
            '<div class="shrink-0">' +
            '<span class="rounded-full px-2.5 py-1 text-xs font-semibold text-white" style="background:' +
            house.color +
            '">' +
            escapeHtml(house.name) +
            "</span>" +
            "</div>" +
            "</div>" +
            "</article>"
          );
        })
        .join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function render() {
      renderHeader();
      renderHouseholdPills();
      renderCategoryPills();
      renderDishes();
    }

    function loadSheet() {
      const script = document.createElement("script");
      script.src = SHEET_URL;
      script.onerror = function () {
        document.getElementById("sync-status").textContent = "Could not load the sheet";
      };
      document.body.appendChild(script);
    }

    render();
    loadSheet();
  </script>
</body>
</html>
